name: Codex Security デモ
on:
  workflow_dispatch:
    inputs:
      upload_sarif:
        description: SARIFをGitHub Securityへ登録する
        type: boolean
        default: true
      pr_number:
        description: スキャン対象のPR番号（必須・差分のみ）
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: codex-security-demo
  cancel-in-progress: false
jobs:
  security:
    name: Codex Security スキャン
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    environment: security-demo
    permissions:
      contents: read
      security-events: write
      statuses: write
      pull-requests: read
      actions: read
    steps:
      - name: miseで固定バージョンの実行環境を準備
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db
        with:
          tool_versions: |
            node 24.4.0
            python 3.13.5
            pnpm 10.13.1
      - name: 信頼したCLIをリポジトリ外へインストール
        working-directory: ${{ runner.temp }}
        run: |
          mkdir -p codex-security-cli
          cd codex-security-cli
          echo '{"private":true}' > package.json
          mise exec node@24.4.0 python@3.13.5 pnpm@10.13.1 -- pnpm add --save-exact --ignore-scripts @openai/codex-security@0.4.0
          mise exec node@24.4.0 python@3.13.5 pnpm@10.13.1 -- ./node_modules/.bin/codex-security --version
      - name: 対象PRの正確なコミットを取得
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          set -euo pipefail
          sha="$GITHUB_SHA"
          ref="$GITHUB_REF"
          [ -n "$PR_NUMBER" ] || { echo "差分スキャンにはPR番号の指定が必要です"; exit 1; }
          if [ -n "$PR_NUMBER" ]; then
            [[ "$PR_NUMBER" =~ ^[0-9]+$ ]] || exit 1
            gh pr view "$PR_NUMBER" --json isCrossRepository,state --jq 'select(.isCrossRepository == false and .state == "OPEN") | .state' | grep -qx OPEN
            sha=$(gh pr view "$PR_NUMBER" --json headRefOid --jq .headRefOid)
            ref="refs/pull/$PR_NUMBER/head"
            base=$(gh pr view "$PR_NUMBER" --json baseRefOid --jq .baseRefOid)
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          gh api "repos/$GH_REPO/statuses/$sha" -f state=pending -f context='Codex Security gate' -f description='対象コミットをスキャン中' -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > /dev/null
      - name: 検証用リポジトリをチェックアウト
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ steps.target.outputs.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: 検証用リポジトリの差分をスキャン
        id: scan
        env:
          OPENAI_API_KEY: ${{ secrets.CODEX_SECURITY_API_KEY }}
          BASE_SHA: ${{ steps.target.outputs.base }}
          HEAD_SHA: ${{ steps.target.outputs.sha }}
          CODEX_SECURITY_STATE_DIR: ${{ runner.temp }}/codex-security-state
        run: |
          set -euo pipefail
          if [ -z "$OPENAI_API_KEY" ]; then
            echo '::error::security-demoのシークレット CODEX_SECURITY_API_KEY が未登録です'
            exit 1
          fi
          base=$(git merge-base "$BASE_SHA" "$HEAD_SHA")
          scan_prompt_path="$RUNNER_TEMP/codex-security-ja.md"
          cat > "$scan_prompt_path" <<'SCAN_PROMPT_JA'
          このスキャンの人間向けの出力は、すべて日本語で記述してください。
          対象は、脅威モデル、レポート、指摘のタイトル・要約・説明・影響・根拠、
          検証内容、Severityの判定理由、修正案、カバレッジ、未確認事項、
          SARIFの指摘メッセージ、および生成するPRのタイトルと本文です。
          JSON/SARIFのキー、仕様上の列挙値、ルールID、分類用のtaxonomy値、
          CWE番号、ファイルパス、コードの識別子とコマンドは仕様どおり維持してください。
          既存のスキャン範囲、検証手順、Severityの判定基準を適用し、
          日本語化によって指摘の意味やSeverityを変更しないでください。
          SCAN_PROMPT_JA
          echo "差分スキャン開始: $(date -u +%FT%TZ); base $base; head $HEAD_SHA"
          mise exec node@24.4.0 python@3.13.5 pnpm@10.13.1 -- "$RUNNER_TEMP/codex-security-cli/node_modules/.bin/codex-security" scan . \
            --diff "$base" --head "$HEAD_SHA" \
            --scan-prompt-file "$scan_prompt_path" \
            --auth api-key --mode standard --max-cost 10 --verbose \
            --fail-on-severity low --output-dir "$RUNNER_TEMP/scan-results" \
            --json > "$RUNNER_TEMP/scan-result.json"
      - name: 完了したスキャンのSARIFだけを出力
        id: export
        if: always()
        run: |
          set -euo pipefail
          manifest_path="$RUNNER_TEMP/scan-results/scan-manifest.json"
          if [ -f "$manifest_path" ] &&
            jq -e '.scan.status == "completed" and (.scan.sealedAt | type == "string" and length > 0)' "$manifest_path" > /dev/null; then
            mise exec node@24.4.0 python@3.13.5 pnpm@10.13.1 -- "$RUNNER_TEMP/codex-security-cli/node_modules/.bin/codex-security" export "$RUNNER_TEMP/scan-results" \
              --export-format sarif --source-root "$GITHUB_WORKSPACE" --output "$RUNNER_TEMP/codex-security.sarif"
            echo 'available=true' >> "$GITHUB_OUTPUT"
          else
            echo 'スキャンが完了・確定していないため、SARIF登録をスキップします。'
          fi
      - name: SARIFをGitHub Securityへ登録
        if: always() && inputs.upload_sarif && steps.export.outputs.available == 'true'
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81
        with:
          sarif_file: ${{ runner.temp }}/codex-security.sarif
          category: codex-security-demo
          ref: ${{ steps.target.outputs.ref }}
          sha: ${{ steps.target.outputs.sha }}
      - name: スキャン結果とSARIFを保存
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: codex-security-demo-results
          path: |
            ${{ runner.temp }}/scan-result.json
            ${{ runner.temp }}/codex-security.sarif
          if-no-files-found: ignore
          retention-days: 7
      - name: 対象コミットのマージゲートを更新
        if: always() && steps.target.outputs.sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SCAN_SHA: ${{ steps.target.outputs.sha }}
          SCAN_OUTCOME: ${{ steps.scan.outcome }}
        run: |
          state=failure
          description='セキュリティ指摘またはスキャンエラー：ログを確認してください'
          if [ "$SCAN_OUTCOME" = success ]; then
            state=success
            description='Low以上の指摘なし：スキャン成功'
          fi
          gh api "repos/$GH_REPO/statuses/$SCAN_SHA" -f state="$state" -f context='Codex Security gate' -f description="$description" -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > /dev/null

